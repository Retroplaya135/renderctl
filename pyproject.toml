[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renderctl"
version = "0.1.0"
description = "Provider-neutral local orchestration primitives for media workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
renderctl = "renderctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
renderctl = ["fixtures/*.json"]
